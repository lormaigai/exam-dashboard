<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Control</title></head><body><script>
(async()=>{
  const source='https://raw.githubusercontent.com/lormaigai/exam-dashboard/2999a4ca4dcd8fdac1f0793b73334ea23aa18d14/index.html';
  try{
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const parsed=new DOMParser().parseFromString(await r.text(),'text/html');
    const scripts=[...parsed.querySelectorAll('script')];
    document.head.innerHTML=parsed.head.innerHTML;
    document.body.innerHTML=parsed.body.innerHTML;
    for(const oldScript of scripts){
      const script=document.createElement('script');
      for(const attr of oldScript.attributes) script.setAttribute(attr.name,attr.value);
      if(oldScript.src){
        await new Promise((resolve,reject)=>{script.onload=resolve;script.onerror=()=>reject(new Error('Failed to load '+oldScript.src));document.body.appendChild(script);});
      }else{
        script.textContent=oldScript.textContent;
        document.body.appendChild(script);
      }
    }
    const addon=document.createElement('script');
    addon.src='scripts/focus-day-timeline.js';
    document.body.appendChild(addon);
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui;padding:32px"><h1>Exam Control</h1><p>Dashboard failed to load.</p><pre>'+String(e).replace(/[&<>]/g,'')+'</pre></main>';
  }
})();
</script></body></html>
