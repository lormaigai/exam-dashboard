<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Control</title></head><body><script>
(async()=>{
  const source='https://raw.githubusercontent.com/lormaigai/exam-dashboard/2999a4ca4dcd8fdac1f0793b73334ea23aa18d14/index.html';
  try{
    const r=await fetch(source,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    const addon='<script src="scripts/focus-day-timeline.js"><\\/script>';
    if(!html.includes('scripts/focus-day-timeline.js')) html=html.replace('</body>',addon+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:system-ui;padding:32px"><h1>Exam Control</h1><p>Dashboard failed to load. Please refresh.</p><pre>'+String(e).replace(/[&<>]/g,'')+'</pre></main>';
  }
})();
</script></body></html>
